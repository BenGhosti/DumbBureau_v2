services:
  backend:
    build: ./backend
    container_name: dumbbureau_backend
    # Mapped to the host so you/your reverse proxy can reach it directly if
    # needed (debugging, emergency access) - but nothing in this stack
    # advertises or routes public traffic to it. Normal traffic always goes
    # through your own nginx -> frontend -> backend (Docker-internal).
    ports:
      - "${BACKEND_PORT:-8361}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////appdata/dumbbureau/db.sqlite}
      - APPDATA_DIR=${APPDATA_DIR:-/appdata/dumbbureau}
      - ADMIN_RECOVERY_SECRET=${ADMIN_RECOVERY_SECRET:-LOCKED_UNTIL_ENV}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8360}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-DumbBureau}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:8360}
      - CHALLENGE_TTL_SECONDS=${CHALLENGE_TTL_SECONDS:-300}
      - ACCESS_TOKEN_TTL_MINUTES=${ACCESS_TOKEN_TTL_MINUTES:-60}
      - INVITE_TOKEN_TTL_DAYS=${INVITE_TOKEN_TTL_DAYS:-7}
      - RECOVERY_TOKEN_TTL_MINUTES=${RECOVERY_TOKEN_TTL_MINUTES:-30}
    volumes:
      - ${APPDATA_DIR:-/appdata/dumbbureau}:/appdata/dumbbureau
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: dumbbureau_frontend
    # Reached by your own external nginx reverse proxy (macvlan, own IP).
    # TLS terminates there - this container and the backend only ever speak
    # plain HTTP inside the Docker network, which is the normal / expected
    # split for a proxy sitting in front of a compose stack.
    ports:
      - "${FRONTEND_PORT:-8360}:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
